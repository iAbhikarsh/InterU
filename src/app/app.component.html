<mat-sidenav-container>
  <mat-sidenav mode="side" opened>
    <mat-nav-list>
      <a mat-list-item routerLink="/csharp">C#</a>
      <a mat-list-item routerLink="/dotnet8">.NET 8</a>
      <a mat-list-item routerLink="/angular">Angular</a>
      <a mat-list-item routerLink="/azure">Azure</a>
      <a mat-list-item routerLink="/ci-cd">CI/CD</a>
      <a mat-list-item routerLink="/system-design">System Design</a>
      <a mat-list-item routerLink="/dsa">Data Structures & Algorithms</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">InterU — Interview Prep</mat-toolbar>

    <div class="qa-form" style="margin: 16px; max-width: 600px;">
      <h2>Add Question & Answer</h2>

      <mat-form-field class="full-width" appearance="outline" style="width:100%; margin-bottom:8px;">
        <mat-label>Question</mat-label>
        <input matInput [(ngModel)]="questionText" placeholder="Enter question" />
      </mat-form-field>

      <mat-form-field class="full-width" appearance="outline" style="width:100%; margin-bottom:8px;">
        <mat-label>Answer</mat-label>
        <textarea matInput rows="3" [(ngModel)]="answerText" placeholder="Enter answer"></textarea>
      </mat-form-field>

      <button mat-raised-button color="primary" (click)="addQa()" [disabled]="!questionText.trim() || !answerText.trim()">
        Add Q&A
      </button>
    </div>

    <div class="qa-list" style="margin: 16px; max-width: 720px;">
      <h2>Questions</h2>

      <mat-list *ngIf="qaList.length; else noQa">
        <mat-list-item *ngFor="let item of qaList; index as i">
          <div style="width: 100%;">
            <strong>{{ i + 1 }}. {{ item.question }}</strong>
            <p>{{ item.answer }}</p>
            <button mat-stroked-button color="warn" (click)="removeQa(i)">Remove</button>
          </div>
        </mat-list-item>
      </mat-list>

      <ng-template #noQa>
        <p>No question added yet.</p>
      </ng-template>
    </div>

    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
