<mat-card>
  <mat-card-header>
    <div mat-card-avatar style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); border-radius: 4px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
      <mat-icon style="color: white;">layers</mat-icon>
    </div>
    <mat-card-title>Angular</mat-card-title>
    <mat-card-subtitle>Framework & Architecture</mat-card-subtitle>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <p>Master Angular framework concepts including architecture, components, and reactive programming with RxJS.</p>
    <div style="margin-top: 16px;">
      <p>Key Topics:</p>
      <ul style="margin: 8px 0;">
        <li>Component architecture and lifecycle</li>
        <li>Dependency injection and services</li>
        <li>RxJS and reactive patterns</li>
      </ul>
    </div>
  </mat-card-content>
  <mat-divider></mat-divider>
  <mat-card-actions>
    <button mat-button color="primary" routerLink="/">
      <mat-icon>arrow_back</mat-icon>
      Back
    </button>
  </mat-card-actions>
</mat-card>
