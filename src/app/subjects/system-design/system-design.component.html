<mat-card>
  <mat-card-header>
    <div mat-card-avatar style="background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); border-radius: 4px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
      <mat-icon style="color: white;">architecture</mat-icon>
    </div>
    <mat-card-title>System Design</mat-card-title>
    <mat-card-subtitle>Scalable Architecture & Design</mat-card-subtitle>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <p>Learn system design principles, scalability, distributed systems, and architectural trade-offs.</p>
    <div style="margin-top: 16px;">
      <p>Key Topics:</p>
      <ul style="margin: 8px 0;">
        <li>System scalability and design patterns</li>
        <li>Database design and optimization</li>
        <li>Architecture trade-offs and decisions</li>
      </ul>
    </div>
  </mat-card-content>
  <mat-divider></mat-divider>
  <mat-card-actions>
    <button mat-button color="primary" routerLink="/">
      <mat-icon>arrow_back</mat-icon>
      Back
    </button>
  </mat-card-actions>
</mat-card>
