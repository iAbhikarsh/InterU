<mat-card>

      <mat-icon style="color: white;">build</mat-icon>
    </div>
    <mat-card-title>CI/CD</mat-card-title>
    <mat-card-subtitle>Pipelines & Deployment</mat-card-subtitle>

        <li>Automated testing strategies</li>
        <li>Deployment and release management</li>
