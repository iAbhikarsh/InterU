<mat-card>
  <mat-card-header>
    <div mat-card-avatar style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); border-radius: 4px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
      <mat-icon style="color: white;">cloud</mat-icon>
    </div>
    <mat-card-title>Azure</mat-card-title>
    <mat-card-subtitle>Cloud Services & Deployment</mat-card-subtitle>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <p>Learn Azure cloud services, architecture patterns, and security best practices for enterprise solutions.</p>
    <div style="margin-top: 16px;">
      <p>Key Topics:</p>
      <ul style="margin: 8px 0;">
        <li>Azure services and ecosystems</li>
        <li>Design patterns for scalability</li>
        <li>Security and compliance</li>
      </ul>
    </div>
  </mat-card-content>
  <mat-divider></mat-divider>
  <mat-card-actions>
    <button mat-button color="primary" routerLink="/">
      <mat-icon>arrow_back</mat-icon>
      Back
    </button>
  </mat-card-actions>
</mat-card>
