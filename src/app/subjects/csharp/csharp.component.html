<mat-card>
  <mat-card-header>
    <div mat-card-avatar style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 4px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
      <mat-icon style="color: white;">code</mat-icon>
    </div>
    <mat-card-title>C#</mat-card-title>
    <mat-card-subtitle>Language & Framework Fundamentals</mat-card-subtitle>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <p>Explore core C# interview topics including language features, runtime concepts, and design patterns.</p>
    <div style="margin-top: 16px;">
      <p>Key Topics:</p>
      <ul style="margin: 8px 0;">
        <li>Language features and syntax</li>
        <li>CLR and runtime behavior</li>
        <li>Design patterns and best practices</li>
      </ul>
    </div>
  </mat-card-content>
  <mat-divider></mat-divider>
  <mat-card-actions>
    <button mat-button color="primary" routerLink="/">
      <mat-icon>arrow_back</mat-icon>
      Back
    </button>
  </mat-card-actions>
</mat-card>
